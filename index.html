  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Archivo',system-ui,sans-serif;

    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px;
    position:relative;
    overflow:hidden;
  }
  body::before{

    background-image:

    z-index:0;
  }
  .wrap{ position:relative; z-index:1; text-align:center; max-width:440px; }
  .mark{ width:96px; height:auto; color:var(--lilac); opacity:0.95; margin:0 auto 26px; display:block; }
  .brand{
    font-family:'Big Shoulders',sans-serif; font-weight:800;
    text-transform:uppercase; font-size:clamp(28px,7vw,40px);
    line-height:1.05; letter-spacing:0.5px; margin:0;
  }
  .rule{ width:40px; height:3px; background:var(--terracotta); border-radius:2px; margin:20px auto; }
  .tagline{ font-style:italic; color:var(--lilac); font-size:15px; margin:0 0 6px; }
  .loc{ color:var(--mist); font-size:13px; letter-spacing:1px; text-transform:uppercase; margin:0; }
  .status{ margin-top:34px; font-size:13px; color:var(--stone); letter-spacing:0.5px; }
  .card-link{
    display:inline-flex; align-items:center; gap:8px; margin-top:22px;
    padding:12px 20px; border:1.4px solid var(--lilac); border-radius:14px;
    color:var(--cream); font-weight:600; font-size:14px; text-decoration:none;
    transition:background .15s ease;
  }
  .card-link:hover{ background:rgba(180,159,206,0.14); }
  .card-link svg{ width:15px; height:15px; }
</style>
